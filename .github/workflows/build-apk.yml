name: Build MOKA IPTV APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create platform folders
        run: |
          flutter create --org com.moka --project-name moka_iptv --platforms=android,ios _shell
          cp -r _shell/android _shell/ios .
          rm -rf _shell
      - name: Set up fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/moka.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/moka.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/moka.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null
          python3 - <<'PY'
          import os
          p = None
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(f):
                  p = f
          s = open(p).read()
          if p.endswith('.kts'):
              block = '''lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              signingConfigs {
                  create("release") {
                      keyAlias = "moka"
                      keyPassword = System.getenv("KEY_PASSWORD")
                      storeFile = file(System.getenv("KEYSTORE_PATH"))
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {'''
              s = s.replace('buildTypes {', block, 1)
              s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
              assert 'getByName("release")' in s
          else:
              block = '''lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              signingConfigs {
                  release {
                      keyAlias 'moka'
                      keyPassword System.getenv("KEY_PASSWORD")
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {'''
              s = s.replace('buildTypes {', block, 1)
              s = s.replace('signingConfigs.debug', 'signingConfigs.release')
              assert 'signingConfigs.release' in s
          open(p, 'w').write(s)
          PY
      - run: pip install pillow
      - run: python tools/setup.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release -t lib/moka_main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: MOKA-IPTV-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build/app/outputs/flutter-apk/app-release.apk MokaIPTV-${{ github.ref_name }}.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Moka IPTV ${{ github.ref_name }}
          files: MokaIPTV-${{ github.ref_name }}.apk
          generate_release_notes: true
