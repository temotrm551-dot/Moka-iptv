name: Build MOKA IPTV APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create platform folders
        run: |
          flutter create --org com.moka --project-name moka_iptv --platforms=android,ios _shell
          cp -r _shell/android _shell/ios .
          rm -rf _shell
      - run: pip install pillow
      - run: python tools/setup.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release -t lib/moka_main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: MOKA-IPTV-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build/app/outputs/flutter-apk/app-release.apk MokaIPTV-${{ github.ref_name }}.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Moka IPTV ${{ github.ref_name }}
          files: MokaIPTV-${{ github.ref_name }}.apk
          generate_release_notes: true
